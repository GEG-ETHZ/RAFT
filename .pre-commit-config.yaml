# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
default_stages: [pre-commit, pre-push]

repos:
  # Fast checks (run on both commit and push just to be safe)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.5
    hooks:
      - id: ruff
        args: [ --fix ]
      - id: ruff-format

  # Strict/Slow checks (run ONLY on push)
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        # pass_filenames: false
        stages: [pre-push]
        # args: [ . ]

  # Every file has a copyright and license (SPDX header or REUSE.toml).
  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.2.0
    hooks:
      - id: reuse

  # Secrets never reach a commit: gitleaks scans the staged diff.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
      # The whole history, every branch and tag; only on request: `just leaks`
      - id: gitleaks
        alias: gitleaks-history
        name: Detect hardcoded secrets in the whole history
        entry: gitleaks git --log-opts=--all --redact
        stages: [manual]
        always_run: true

  # Built-in hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace

      - id: end-of-file-fixer

      - id: check-yaml

      - id: check-added-large-files
        args: ['--maxkb=2000']
      - id: no-commit-to-branch # blocks commits AND pushes to main
        args: [--branch, main]
        stages: [pre-commit, pre-push]

  # Tests (run ONLY on push)
  - repo: local
    hooks:
      - id: pytest
        name: Run test suite
        entry: uv run pytest -v
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]
