mesh:
  file: box_complex.msh
  dimensions: 3

material:
  # Rock mass parameters
  solid:
      bulk_mod:  30.0e+9        # Pa
      density: 2650.0             # kg/m^3
      therm_cond: 3.0          # W/mK
      specific_heat: 900.0        # J/kgK
      therm_expansion: 12.0e-6  # 1/K  (3 * 4e-6)

  # Fluid parameters
  fluid:
      bulk_mod: 2.10e+9         # Pa
      density:      925         # kg/m^3
      therm_cond:   0.6         # W/mK
      therm_expansion: 200.0e-6 # 1/K
      specific_heat: 4200       # J/kgK
      viscosity: 0.7e-3         # m^2 (permeability)

  # Coupled parameters
  porosity: 0.01                # -
  biot_coeff: 0.5               # -
  permeability: 1.0e-16         # m^2

initial_conditions:
  geothermal_gradient: 0.0      # deg C/m
  T_surf: 200                   # deg C
  pressure_gradient: 0.0        # Pa/m
  p_surf: 1.0e+5


boundary_conditions:
  pressure_fixed:
      - {nodes: [1000,2000, 3000], values: [1e5, 1e5, 1e5]}

  temperature_fixed:
      - {nodes: [500, 1000, 2000, 3000], values: [70, 200, 200, 200]}

  fluid_flux:
      - {nodes: [500], values: [10]}

  temperature_flux:
      - {nodes: [], values: []}

simulation:
  # Time
  t_start: 0.0
  t_end: 1.0e+6
  timestep: 1.0e+4
  timestep_min: 1.0
  timestep_max: 1.0e+4

  # Output
  output_frequency: 1
  output_vtk: 1        # turn vtk output on/off
  # output_directory: "/some/custom/path"  # optional; defaults to /main_folder/outputs/

  # Physical controls
  rate_order: 1     # order of rate of change approximation
  advection_on: 1
  pressurization_on: 1
  buoyancy_on: 1

  # Numerical controls
  rel_error_T: 1.0e-2 # Relative error for extrapolation
