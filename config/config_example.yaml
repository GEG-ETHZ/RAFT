mesh:
  file: box_regions.msh
  dimensions: 3
  domain:  # outer boundary, used by scripts/raft_to_geo.py
      shape: "box"
      values: [[0,0,0], [250, 730, 450]]
  sizing:  # element sizes, used by scripts/raft_to_geo.py
    outer: 75
    bc: [[0.5, 5], [7.5, 50]]
  regions:
    - shape: "polyhedron"
      values: [[0, 0, 450],
             [500, 0, 450],
             [500, 730, 450],
             [0, 730, 450],
             [0, 0, 350],
             [500, 0, 350],
             [500, 730, 100],
             [0, 730, 100]]
      region_number: 1
    - shape: "cylinder"
      values: [[0, 375, 0], 50, [0,0,1]]
      region_number: 2

material:
  # Rock mass parameters - define lists with properties corresponding to each region
  solid:
      bulk_mod:  [20.0e+9, 20.0e+9, 20.0e+9]        # Pa
      density: [2600, 200, 2000]             # kg/m^3
      therm_cond: [1.5, 1.5, 3.0]          # W/mK
      specific_heat: [850, 900, 800]        # J/kgK
      therm_expansion: [12.0e-6, 13.0e-6, 12.0e-6]  # 1/K  (3 * 4e-6)
      porosity: [0.01, 0.01, 0.01]                # -
      biot_coeff: [0.5, 0.9, 0.5]               # -
      permeability: [[1.0e-15, 1.0e-15, 1.0e-17],   [1.0e-14, 1.0e-14, 1.0e-15],   1.0e-19]       # m^2
      rotation_x: [0.0, -15.0, 0.0]  # rotation of local coordinates around x-axis (degrees)
      rotation_y: [20.0, 0.0, 0.0] # rotation of local coordinates around y-axis (degrees)
      rotation_z: [0.0, 0.0, 0.0]  # rotation of local coordinates around z-axis (degrees)

  # Fluid parameters - single phase flow is assumed
  fluid:
      fluid_type: "water"
      density: 925            # kg/m^3 - Options: >0 -> constant value; = 0 -> pressure and temperature dependent fluid_type lookup
      bulk_mod: 2.10e+9       # Pa
      therm_expansion: 200.0e-6 # 1/K
      specific_heat: 4250     # J/kgK
      therm_cond: 0.6         # W/mK
      viscosity: -1           # Pa-s - Options: >0 -> constant value; = 0 -> pressure and temperature dependent fluid_type lookup; = -1 -> temperature dependent only (calibrated for water only)

initial_conditions:
  assignment: "BC_compatible"
  T_ini: 286
  p_ini: 1.0e+6
  T_grad: 0.1
  p_grad: 1.0e+3
  grad_direction_T: [0,1,-1]
  grad_direction_p: [0,-1,-1]



boundary_conditions:
      - faces: [z_max]
        hydraulics:
            type: "pressure"
            values: [1.0e+6]
        thermal:
            type: "temperature"
            values: [310]
      - faces: [z_min]
        thermal:
            type: "flux"
            values: [0.2]


      - lines: [[[0, 550, 250], [50, 550, 250]]]
        label: "wellbore_in"
        hydraulics:
            type: "flux"
            values: [[0, 30000], [0, 1]]
            function: "table"
            constraints:
                maximum_pressure: 3.0e+7
        thermal:
            type: "temperature"
            values: [[0, 3000], [323, 400]]
            function: "table"

      - lines: [[[0, 152, 340], [50, 152, 340]]]
        label: "wellbore_out"
        hydraulics:
            type: "flux"
            values: [[0, 30000], [0, -1]]
            function: "table"
            constraints:
                minimum_pressure: 1.0e+5


physics:
  matrix:
    flow: transient
    heat: transient
    advection: on

simulation:
  # Time
  t_start: 0.0
  t_end: 30.0e+7 # 10 years
  timestep: 10000.0
  timestep_min: 1000
  timestep_max: 2.5e+6 # one month

  # Output
  output_frequency: 1
  output_vtk: 1        # turn vtk output on/off
  # output_directory: "/some/custom/path"  # optional; defaults to /main_folder/outputs/
  output_viscosity: 1
  output_density: 1
  output_porosity: 1

  # Physical controls
  rate_order: 1     # order of rate of change approximation
  gravity: -9.81    # m/s^2

  # Numerical controls
  solver_type: "operator_split"
  rel_error_T: 2.0e-1 # Relative error for extrapolation
  iterative_controls:
      NR_tol: 1.0e-6 # Newton-Raphson residual tolerance
      iter_max: 50 # Maximum number of iterations
      aitken_relaxation: 1 # Turn on/off Aitken's delta^2 relaxation
