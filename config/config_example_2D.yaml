mesh:
  file: square2D.msh
  regions:
      - shape: "sphere"
        values: [[25.5, 25, 0], 10]
        region_number: 1
      - shape: "sphere"
        values: [[34, 38.5, 0], 5]
        region_number: 1
      - shape: "polyhedron"
        values: [[0, 75], [102, 75], [0, 55], [-51, 55], [-51, 75]]
        region_number: 2
  dimensions: 2
  fractures:
         - values: [[12.5, 49, 0.0], [52.5], [9]]
         - values: [[18, 28, 0.0], [62.5], [35]]
         - values: [[-10, 32, 0.0], [22.5], [100]]


material:
  # Rock mass parameters - define lists with properties corresponding to each region
  solid:
      bulk_mod:  [20.0e+9, 20.0e+9, 20.0e+9]        # Pa
      density: [20, 20, 20]             # kg/m^3
      therm_cond: [3.0, 3.0, 3.0]          # W/mK
      specific_heat: [8, 80, 10]        # J/kgK
      therm_expansion: [12.0e-6, 13.0e-6, 12.0e-6]  # 1/K  (3 * 4e-6)
      porosity: [0.1, 0.05, 0.01]                # -
      biot_coeff: [0.5, 0.9, 0.5]               # -
      permeability: [[1.0e-15, 3.0e-14],   1.0e-19, 1.0e-17]       # m^2
      rotation_x: [-50.0, 40.0, 0.0]  # rotation of local coordinates around x-axis (degrees)
      rotation_y: [0.0, 0.0, 0.0] # rotation of local coordinates around y-axis (degrees)
      rotation_z: [40.0, 0.0, 0.0]  # rotation of local coordinates around z-axis (degrees)

  # Fluid parameters - single phase flow is assumed
  fluid:
      bulk_mod: 2.10e+9         # Pa
      density:      925         # kg/m^3
      reference_temperature: 413 # Reference temperature for density (C/K)
      therm_cond:   0.6         # W/mK
      therm_expansion: 200.0e-6 # 1/K
      specific_heat: 4250       # J/kgK
      viscosity: 0       # 0 -> non-constant, real-fluid viscosity

  # Fracture parameters
  fracture:
    aperture: [1.0e-3, 1.0e-3, 1.1e-3]
    nusselt: [5, 1, 5]

initial_conditions:
  assignment: "BC_compatible"
  T_ini: 286
  p_ini: 1.0e+5
  T_grad: 0.1
  p_grad: 1.0e+3
  grad_direction_T: [0,1,-1]
  grad_direction_p: [0,-1,-1]



boundary_conditions:
  wellbore:
        - lines: [[[43.4, 20.0], [53, 37.5]]]
          values: [[0, 0.001], 100]
          function: "ramp"
          tag: "inlet"
          constraints:
              maximum_pressure: 3.0e+7
              minimum_pressure: 1.0e+4
        - lines: [[[-40.0, 35.9], [-33.7, 27.3]]]
          values: [[0, -0.001], 100]
          function: "ramp"
          tag: "outlet"
          constraints:
              maximum_pressure: 3.0e+7
              minimum_pressure: 1.0e+4
  pressure_fixed:
        - faces: [y_min]
          values: [2.0e6]
          tag: "inflow"
        - faces: [y_max]
          values: [1.0e6]


  temperature_fixed:
      - faces: [y_max]
        values: [273]
      - faces: [y_min]
        values: [373]
      - lines: [[[43.4, 20.0], [53, 37.5]]]
        function: "ramp"
        values: [[323, 403], 100]


  fluid_flux:

  temperature_flux:


simulation:
  # Time
  t_start: 0.0
  t_end: 50000.0
  timestep: 1.0
  timestep_min: 1.0
  timestep_max: 10000.0
  solver_type: "linearized"

  # Output
  output_frequency: 1
  output_vtk: 1        # turn vtk output on/off
  output_log: 1        # log console output to file
  # output_directory: "/some/custom/path"  # optional; defaults to /main_folder/outputs/
  output_viscosity: 1
  output_density: 1

  # Physical controls
  rate_order: 1     # order of rate of change approximation
  advection_on: 1
  pressurization_on: 0
  gravity: -9.81
  steady_pressure: 0
  steady_temperature: 0
  axisymmetric_on: 0

  # Numerical controls
  rel_error_T: 1.0e-2 # Relative error for extrapolation
  iterative_controls:
      NR_tol: 1.0e-5 # Newton-Raphson residual tolerance
      iter_max: 30 # Maximum number of iterations
      aitken_relaxation: 1 # Turn on/off Aitken's delta^2 relaxation
      ptc_sigma_max: 10.0
      ptc_sigma_floor: 1.0e-3
