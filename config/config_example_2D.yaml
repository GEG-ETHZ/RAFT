mesh:
  file: 2D_example.msh
  dimensions: 2
  domain:  # outer boundary, used by scripts/raft_to_geo.py
        shape: "box"
        values: [[-51, -50], [102, 75]]
  # removing discrete fractures to better see re-alignment of flow field
  sizing:  # element sizes, used by scripts/raft_to_geo.py
      outer: 20
      frac: [[1, 1, 2], [1, 5, 20]]
      bc: [[0.5, 2], [1, 10]]

  regions:
      - shape: "sphere"
        values: [[25.5, 25, 0], 10]
        region_number: 1
      - shape: "sphere"
        values: [[34, 38.5, 0], 5]
        region_number: 1
      - shape: "polyhedron"
        values: [[0, 75], [102, 75], [0, 55], [-51, 55], [-51, 75]]
        region_number: 2
  # removing discrete fractures to better see re-alignment of flow field
  fractures:
         - values: [[27, 53], [20], [20]]
         - values: [[45.5, 41], [22], [130]]
         - values: [[13, 33, 0.0], [20], [100]]


material:
  # Rock mass parameters - define lists with properties corresponding to each region
  solid:
      bulk_mod:  [20.0e+9, 20.0e+9, 20.0e+9]        # Pa
      density: [2000, 2000, 2000]             # kg/m^3
      therm_cond: [3.0, 3.0, 3.0]          # W/mK
      specific_heat: [800, 800, 800]        # J/kgK
      therm_expansion: [12.0e-6, 13.0e-6, 12.0e-6]  # 1/K  (3 * 4e-6)
      porosity: [0.01, 0.01, 0.01]                # -
      biot_coeff: [0.5, 0.9, 0.5]               # -
      permeability: [[5.0e-15, 5.0e-16],   1.0e-18, 1.0e-17]       # m^2
      rotation_x: [0.0, 40.0, 0.0]  # rotation of local coordinates around x-axis (degrees)
      rotation_y: [30.0, 0.0, 0.0] # rotation of local coordinates around y-axis (degrees)
      rotation_z: [0.0, 0.0, 0.0]  # rotation of local coordinates around z-axis (degrees)
      b_BB: [3.16e-7, 3.16e-7, 3.16e-7]  # 1/Pa
      stress_init: [32.0e+6, 32.0e+6, 32.0e+6]  # Pa

  # Fluid parameters - single phase flow is assumed
  fluid:
      fluid_type: "Water"     # "Water" or "CO2"
      density: 1000           # kg/m^3 - Options: >0 -> constant value; = 0 -> pressure and temperature dependent fluid_type lookup
      reference_temperature: 293 # Reference temperature for density (K)
      reference_pressure: 1.0e+5 # Reference pressure for density (Pa)
      bulk_mod: 2.10e+9 #Pa
      therm_expansion: 200.0e-6 # 1/K
      specific_heat: 4200     # J/kgK
      therm_cond: 0.6         # W/mK
      viscosity: -1           # Pa-s - Options: >0 -> constant value; = 0 -> pressure and temperature dependent fluid_type lookup; = -1 -> temperature dependent only (calibrated for water only)

  # removing discrete fractures to better see re-alignment of flow field
  # Fracture parameters
  fracture:
    aperture: [1.0e-6, 1.0e-6, 1.1e-6]
    heat_transfer_factor: [1, 1, 1]

initial_conditions:
  assignment: "constant"
  T_ini: 410
  p_ini: 6.0e+6
  T_grad: 0.1
  p_grad: 1.0e+3
  grad_direction_T: [0,1,-1]
  grad_direction_p: [0,-1,-1]



boundary_conditions:
        # Inlet/outlet example: a rate-controlled well, switching to a pressure
        # limit if it would otherwise exceed the given bounds.
        - lines: [[[43.4, 20.0], [45, 30]]]
          label: "inlet"
          hydraulics:
              type: "flux"
              values: [[0, 0.001], 1000]
              function: "ramp"
              constraints:
                  maximum_pressure: 3.0e+7
                  minimum_pressure: 1.0e+5
          thermal:
              type: "temperature"
              values: [330]

        - lines: [[[0, 40.0], [-20, 25]]]
          label: "outlet"
          hydraulics:
              type: "flux"
              values: [[0, -0.001], 1000]
              function: "ramp"
              constraints:
                  maximum_pressure: 3.0e+7
                  minimum_pressure: 1.0e+5

        - faces: [y_max]
          hydraulics:
              type: "pressure"
              values: [6.0e+6]
          thermal:
              type: "temperature"
              values: [410]

        - faces: [y_min]
          hydraulics:
              type: "pressure"
              values: [6.0e+6]
          thermal:
              type: "temperature"
              values: [410]


physics:
  matrix:
    flow: steady
    heat: steady
    advection: off

simulation:
  # Time
  t_start: 0.0
  t_end: 3.0e+7
  timestep: 10.0
  timestep_min: 1.0
  timestep_max: 1.0e+4

  # Output
  output_frequency: 1
  output_vtk: 1        # turn vtk output on/off
  output_log: 1        # log console output to file
  # output_directory: "/some/custom/path"  # optional; defaults to /main_folder/outputs/
  output_viscosity: 1
  output_density: 1
  output_porosity: 1

  # Physical controls
  rate_order: 1     # order of rate of change approximation
  gravity: 10    # m/s^2
  axisymmetric_on: 0

  # Numerical controls
  solver_type: "fully_coupled"
  rel_error_T: 5.0e-2 # Relative error for extrapolation
  iterative_controls:
      NR_tol: 2.0e-5 # Newton-Raphson residual tolerance
      iter_max: 50 # Maximum number of iterations
      NR_step: 1
      aitken_relaxation: 1 # Turn on/off Aitken's delta^2 relaxation
