mesh:
  file: AGS_single.msh
  dimensions: 3
  wells:
    - alignment: [ [ [50, 50, 0], [50, 50, 1500] ],
                   [ [50, 50, 1500], [1050, 50, 1500]],
                   [ [1050, 50, 1500], [1050, 50, 0]] ]


material:
  # Rock mass parameters - define lists with properties corresponding to each region
  solid:
      bulk_mod:  [20.0e+19]        # Pa
      density: [2600]             # kg/m^3
      therm_cond: [2.5]          # W/mK
      specific_heat: [850]        # J/kgK
      therm_expansion: [0.0e-6]  # 1/K  (3 * 4e-6)
      porosity: [0.01]                # -
      biot_coeff: [0.5]               # -
      permeability: [1.0e-15]       # m^2
      rotation_x: [0.0]  # rotation of local coordinates around x-axis (degrees)
      rotation_y: [0.0] # rotation of local coordinates around y-axis (degrees)
      rotation_z: [0.0]  # rotation of local coordinates around z-axis (degrees)

  # Fluid parameters - single phase flow is assumed
  fluid:
      fluid_type: "Water"
      density: 1000            # kg/m^3 - Options: >0 -> constant value; = 0 -> pressure and temperature dependent fluid_type lookup
      bulk_mod: 2.10e+9       # Pa
      therm_expansion: 200.0e-6 # 1/K
      specific_heat: 4250     # J/kgK
      therm_cond: 0.6        # W/mK
      viscosity: 0.7e-3           # Pa-s - Options: >0 -> constant value; = 0 -> pressure and temperature dependent fluid_type lookup; = -1 -> temperature dependent only (calibrated for water only)
      reference_pressure: 1.0e+6
      reference_temperature: 350

  wells:
    diameter: [0.15]
    perforation_conductance: [0]
    heat_transfer_factor: [1]
    roughness: [0.0002]

initial_conditions:
  assignment: "gradient"
  T_ini: 290
  p_ini: 1.0e+5
  T_grad: 0.06
  p_grad: 1.0e+4
  grad_direction_T: [0,0,1]
  grad_direction_p: [0,0,1]



boundary_conditions:
     # AGS in hot dry rock
      - nodes: "matrix" # "matrix" fixes the pressure in the rock mass
        hydraulics:
            type: "pressure"
            function: "gradient"
            values: [[0,0,-1], [1.0e+5], [1.0e+4]]


      - well: [0, "inlet"]
        label: "inlet"
        hydraulics:
            type: "flux"
            function: "external"
        thermal:
            type: "temperature"
            function: "external"

      - well: [0, "outlet"]
        label: "outlet"
        hydraulics:
            type: "pressure"
            function: "external"

      - faces: ["z_max"]
        thermal:
           type: "temperature"
           values: [398]


physics:
  matrix:
    flow: off
    heat: transient
    advection: off
  wells:
    flow: steady
    heat: transient
    advection: on

simulation:
  # Time
  t_start: 0.0
  t_end: 15.0e+7 # 10 years
  timestep: 10000.0
  timestep_min: 1000.0
  timestep_max: 1.25e+6 # 4 months

  # Output
  output_frequency: 1
  output_vtk: 1        # turn vtk output on/off
  # output_directory: "/some/custom/path"  # optional; defaults to /main_folder/outputs/
  output_viscosity: 1
  output_density: 1
  output_porosity: 1

  # Physical controls
  rate_order: 1     # order of rate of change approximation
  gravity: -10    # m/s^2

  # Numerical controls
  solver_type: "linearized"
  rel_error_T: 2.0e-2 # Relative error for extrapolation
  iterative_controls:
      NR_tol: 1.0e-7 # Newton-Raphson residual tolerance
      iter_max: 50 # Maximum number of iterations
      aitken_relaxation: 1 # Turn on/off Aitken's delta^2 relaxation
