mesh:
  file: box_profiling.msh
  dimensions: 3

material:
  # Rock mass parameters
  solid:
    bulk_mod:  30.0e+9        # Pa
    density: 2650.0             # kg/m^3
    therm_cond: 3.0          # W/mK
    specific_heat: 900.0        # J/kgK
    therm_expansion: 12.0e-6  # 1/K  (3 * 4e-6)
    porosity: 0.01                # -
    biot_coeff: 0.5               # -
    permeability: 1.0e-16         # m^2

  # Fluid parameters
  fluid:
      density: 925            # kg/m^3 - Options: >0 -> constant value; = 0 -> pressure and temperature dependent fluid_type lookup
      reference_temperature: 400 # Reference temperature for density (K)
      bulk_mod: 2.10e+9       # Pa
      therm_expansion: 200.0e-6 # 1/K
      specific_heat: 4200     # J/kgK
      therm_cond: 0.6         # W/mK
      viscosity: 0.7e-3       # Pa-s - Options: >0 -> constant value; = 0 -> pressure and temperature dependent fluid_type lookup; = -1 -> temperature dependent only (calibrated for water only)

initial_conditions:
  T_ini: 400                  # deg C
  p_ini: 1.0e+5


boundary_conditions:
  - faces: [y_min]
    hydraulics:
      values: [1e5]
      type: pressure
  - nodes: [4]
    hydraulics:
      values: [0.001]
      type: flux
    thermal:
      values: [300]
      type: temperature
  - faces: [y_max]
    hydraulics:
      values: [0.001]
      type: flux
    thermal:
      values: [350]
      type: temperature


physics:
  matrix:
    flow: transient
    heat: transient
    advection: on

simulation:
  # Time
  t_start: 0.0
  t_end: 1.0e+6
  timestep: 1.0e+3
  timestep_min: 1.0e+3
  timestep_max: 1.0e+4

  # Output
  output_frequency: 1
  output_vtk: 1        # turn vtk output on/off
  # output_directory: "/some/custom/path"  # optional; defaults to /main_folder/outputs/
  output_viscosity: 1
  output_density: 1
  output_porosity: 1

  # Physical controls
  rate_order: 1     # order of rate of change approximation
  gravity: -9.81    # m/s^2

  # Numerical controls
  rel_error_T: 5.0e-1 # Relative error for extrapolation
