mesh:
  file: box_profiling.msh
  dimensions: 3

material:
  # Rock mass parameters
  solid:
    bulk_mod:  30.0e+9        # Pa
    density: 2650.0             # kg/m^3
    therm_cond: 3.0          # W/mK
    specific_heat: 900.0        # J/kgK
    therm_expansion: 12.0e-6  # 1/K  (3 * 4e-6)
    porosity: 0.01                # -
    biot_coeff: 0.5               # -
    permeability: 1.0e-16         # m^2

  # Fluid parameters
  fluid:
      bulk_mod: 2.10e+9         # Pa
      density:      925         # kg/m^3
      therm_cond:   0.6         # W/mK
      therm_expansion: 200.0e-4 # 1/K
      specific_heat: 4200       # J/kgK
      viscosity: 0.7e-3         # m^2 (permeability)

initial_conditions:
  T_ini: 200                  # deg C
  p_ini: 1.0e+5


boundary_conditions:
  - nodes: [0, 1, 2, 3, 7, 8, 9, 10]
    hydraulics:
      values: [1e5]
      type: pressure
  - nodes: [4]
    hydraulics:
      values: [0.1]
      type: flux
  - nodes: [13]
    hydraulics:
      values: [0.5]
      type: flux
  - nodes: [4]
    thermal:
      values: [10]
      type: temperature
  - nodes: [13]
    thermal:
      values: [100]
      type: temperature
  - nodes: []
    thermal:
      values: []
      type: flux

simulation:
  # Time
  t_start: 0.0
  t_end: 3.0e+5
  timestep: 1.0e+3
  timestep_min: 1.0e+3
  timestep_max: 1.0e+4

  # Output
  output_frequency: 1
  output_vtk: 1        # turn vtk output on/off
  # output_directory: "/some/custom/path"  # optional; defaults to /main_folder/outputs/

  # Physical controls
  rate_order: 1     # order of rate of change approximation
  advection_on: 1
  pressurization_on: 1
  gravity: -9.81

  # Numerical controls
  rel_error_T: 5.0e-1 # Relative error for extrapolation
