[project]
name = "raft"
version = "0.1.0"
description = "THM simulator for native coupling with TANGO"
authors = [{name = "ETHZ/EAPS/GEG Group"}]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pyyaml",
    "numba",
    "CoolProp",
    ]


[dependency-groups]   # e.g. uv add --group dev ruff
dev = [
    "mypy~=1.19", # static type checker
    "pytest~=9.0", # testing
    "ruff~=0.15", # linter and formatter
    "pylsp-mypy~=0.7", # provides connection from python LSP to mypy
    "pylsp-rope~=0.1", # provides linting tools
    "types-pyyaml>=6.0.12.20260518",
    "scipy-stubs>=1.17.1.5",
    "prek==0.3.13",
    "rust-just>=1.58.0", # task runner for the justfile (`uv run just <recipe>`)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/raft"]

[tool.ruff]
target-version = "py311"
line-length = 110
src = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = [
    "A",    # flake8-builtins
    "ARG",  # flake8-unused-arguments
    "C4",   # flake8-comprehensions
    "C90",  # mccabe
    "D",    # pydocstyle
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "SIM",  # flake8-simplify
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]
ignore = [
    "D400",
    "D415",
    "D205",
    "N802",
    "N806",
    "N803",
]

[tool.ruff.lint.isort]
known-first-party = ["raft"]

[tool.ruff.lint.per-file-ignores]   # otherwise ruff shows "imported but unused" error
"__init__.py" = ["F401"]
"tests/**" = ["D"]                  # no docstring rules inside tests/ folder

[tool.ruff.lint.pydocstyle]   # defines the doc string format
convention = "google"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
# Enables strict mypy checks; comment this out for projects that do not require strict type checking.
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
