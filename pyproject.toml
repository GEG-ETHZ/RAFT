[project]
name = "geg-raft"
version = "0.2.1"
description = "THM simulator for native coupling with TANGO"
authors = [{name = "Geothermal Energy and Geofluids Group, ETH Zurich", email = "chad.baker@eaps.ethz.ch"}]
maintainers = [{name = "Chad Baker", email = "chad.baker@eaps.ethz.ch"}]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pyyaml",
    "numba",
    "CoolProp",
    ]

[project.urls]
Repository = "https://github.com/GEG-ETHZ/RAFT"
Changelog = "https://github.com/GEG-ETHZ/RAFT/blob/main/CHANGELOG.md"
Issues = "https://github.com/GEG-ETHZ/RAFT/issues"


[dependency-groups]   # e.g. uv add --group dev ruff
dev = [
    "mypy~=1.19", # static type checker
    "pytest~=9.0", # testing
    "ruff~=0.15", # linter and formatter
    "pylsp-mypy~=0.7", # provides connection from python LSP to mypy
    "pylsp-rope~=0.1", # provides linting tools
    "types-pyyaml>=6.0.12.20260518",
    "scipy-stubs>=1.17.1.5",
    "prek==0.3.13",
    "rust-just>=1.58.0", # task runner for the justfile (`uv run just <recipe>`)
]
docs = [
    "sphinx~=8.2",
    "myst-parser~=4.0", # renders Markdown (README.md, theory.md) as Sphinx source
    "furo~=2025.9", # HTML theme
]

[build-system]
requires = ["hatchling>=1.27"]  # 1.27 writes the SPDX license expression (PEP 639)
build-backend = "hatchling.build"

# The sdist holds the package's source, its tests (with their configs and
# meshes), and the release files. Everything else in the repository (agent
# config, CI, docs sources, example configs, figures, scripts) stays out of the
# published release. pyproject.toml is always included.
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/CHANGELOG.md",
    "/CITATION.cff",
    "/LICENSE",
    "/LICENSES",
    "/NOTICE",
    "/REUSE.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/geg_raft"]

[tool.ruff]
target-version = "py311"
line-length = 110
src = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = [
    "A",    # flake8-builtins
    "ARG",  # flake8-unused-arguments
    "C4",   # flake8-comprehensions
    "C90",  # mccabe
    "D",    # pydocstyle
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "SIM",  # flake8-simplify
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]
ignore = [
    "D400",
    "D415",
    "D205",
    "N802",
    "N806",
    "N803",
]

[tool.ruff.lint.isort]
known-first-party = ["geg_raft"]

[tool.ruff.lint.per-file-ignores]   # otherwise ruff shows "imported but unused" error
"__init__.py" = ["F401"]
"tests/**" = ["D"]                  # no docstring rules inside tests/ folder
"docs/source/conf.py" = ["D100", "A001"]   # Sphinx config: no docstring, `copyright` is its convention

[tool.ruff.lint.pydocstyle]   # defines the doc string format
convention = "google"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
# Enables strict mypy checks; comment this out for projects that do not require strict type checking.
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
