mesh:
  file: boxZ_NL_visc.msh
  dimensions: 3

material:
  # Rock mass parameters
  solid:
      bulk_mod:  20.0e+9        # Pa
      density: 2000.0             # kg/m^3
      therm_cond: 3.0          # W/mK
      specific_heat: 1000        # J/kgK
      therm_expansion: 0.0e-6  # 1/K  (3 * 4e-6)
      porosity: 0.01                # -
      biot_coeff: 0.5               # -
      permeability: 5.0e-13         # m^2
  # Fluid parameters
  fluid:
      bulk_mod: 2.10e+30         # Pa
      density:      1000         # kg/m^3
      therm_cond:   3         # W/mK
      therm_expansion: 00.0e-6 # 1/K
      specific_heat: 4000       # J/kgK
      viscosity: 0        # 0 -> non-constant, real-fluid viscosity from CoolProp


initial_conditions:
  assignment: "BC_compatible"
  T_ini: 286
  p_ini: 8.0e+7
  T_grad: 0.1
  p_grad: 1.0e+3


boundary_conditions:
  - faces: [z_min]
    hydraulics:
      values: [8000000.0]
      type: pressure
    thermal:
      values: [340]
      type: temperature
  - faces: [z_max]
    hydraulics:
      values: [-0.0007]
      type: flux
    thermal:
      values: [410]
      type: temperature


simulation:
  # Time
  t_start: 0.0
  t_end: 1.0
  timestep: 1.0
  timestep_min: 1.0
  timestep_max: 1.0

  # Output
  output_frequency: 1
  output_vtk: 0        # turn vtk output on/off
  output_viscosity: 1
  # output_directory: "/some/custom/path"  # optional; defaults to /main_folder/outputs/

  # Physical controls
  rate_order: 1     # order of rate of change approximation
  advection_on: 1
  gravity: 0.0
  steady_pressure: 1
  steady_temperature: 1

  # Numerical controls
  rel_error_T: 1.0e-2 # Relative error for extrapolation
  iterative_controls:
      NR_tol: 1.0e-5 # Newton-Raphson residual tolerance
      iter_max: 50 # Maximum number of iterations
      aitken_relaxation: 1 # Turn on/off Aitken's delta^2 relaxation
