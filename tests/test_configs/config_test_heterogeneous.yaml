mesh:
  file: boxZ_uniform.msh
  dimensions: 3
  regions:
    - shape: "polyhedron"
      values: [[0, 0, 0],
               [51, 0, 0],
               [51, 73, 0],
               [0, 73, 0],
               [0, 0, 21],
               [51, 0, 21],
               [51, 73, 21],
               [0, 73, 21]]
      region_number: 1
material:
  # Rock mass parameters
  solid:
      bulk_mod:  [20.0e+9, 20.0e+9]        # Pa
      density: [2.0, 2.0]             # kg/m^3
      therm_cond: [3.0, 2.0]          # W/mK
      specific_heat: [1000, 100]        # J/kgK
      therm_expansion: [0.0e-6, 0.0e-6]  # 1/K  (3 * 4e-6)
      porosity: [1.0e-06, 1.0e-06]                # -
      biot_coeff: [0.5, 0.5]               # -
      permeability: [5.0e-13, 1.0e-12]         # m^2
      rotation_x: [0.0, 0.0, 0.0, 0.0]  # rotation of local coordinates around x-axis (degrees)
      rotation_y: [0.0, 0.0, 0.0, 0.0] # rotation of local coordinates around y-axis (degrees)
      rotation_z: [0.0, 0.0, 0.0, 0.0]  # rotation of local coordinates around z-axis (degrees)
  # Fluid parameters
  fluid:
      density: 1              # kg/m^3 - Options: >0 -> constant value; = 0 -> pressure and temperature dependent fluid_type lookup
      bulk_mod: 2.10e+30      # Pa
      therm_expansion: 00.0e-6 # 1/K
      specific_heat: 1000     # J/kgK
      therm_cond: 3           # W/mK
      viscosity: 0.7e-3       # Pa-s - Options: >0 -> constant value; = 0 -> pressure and temperature dependent fluid_type lookup; = -1 -> temperature dependent only (calibrated for water only)


initial_conditions:
  geothermal_gradient: 0.0      # deg C/m
  T_surf: 200                   # deg C
  pressure_gradient: 0.0        # Pa/m
  p_surf: 1.0


boundary_conditions:
  - nodes: [0, 1, 2, 3]
    hydraulics:
      values: [7]
      type: pressure
  - nodes: [4, 5, 6, 7]
    hydraulics:
      values: [43]
      type: flux
  - nodes: [0, 1, 2, 3]
    thermal:
      values: [72]
      type: temperature
  - nodes: [4, 5, 6, 7]
    thermal:
      values: [37]
      type: flux

physics:
  matrix:
    flow: steady
    heat: steady
    advection: off

simulation:
  # Time
  t_start: 0.0
  t_end: 1.0
  timestep: 1.0
  timestep_min: 1.0
  timestep_max: 1.0

  # Output
  output_frequency: 1
  output_vtk: 0       # turn vtk output on/off
  # output_directory: "/some/custom/path"  # optional; defaults to /main_folder/outputs/

  # Physical controls
  rate_order: 1     # order of rate of change approximation
  gravity: 0.0    # m/s^2

  # Numerical controls
  rel_error_T: 1.0e-2 # Relative error for extrapolation
