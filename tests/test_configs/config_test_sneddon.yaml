mesh:
  file: sneddon2D.msh
  dimensions: 2
  domain:  # outer boundary, used by scripts/raft_to_geo.py
      shape: "box"
      values: [[-40, -40], [40, 40]]
  sizing:  # element sizes, used by scripts/raft_to_geo.py
      outer: 2.0
      frac: [[0.02, 0.02], [0.3, 6]]
      quads: true
  fractures:
      - values: [[0.0, 0.0, 0.0], [1.0], [0]]

material:
  # Rock mass parameters
  solid:
      bulk_mod: 20.0e+9         # Pa
      biot_coeff: 0.5           # -
      poisson_ratio: 0.25       # -
      porosity: 0.01            # -
      permeability: 1.0e-18     # m^2
      therm_expansion: 0.0      # 1/K

  # Fluid parameters
  fluid:
      density: 1000           # kg/m^3
      bulk_mod: 2.0e+9        # Pa
      therm_expansion: 0.0    # 1/K
      viscosity: 1.0e-3       # Pa-s

  # Fracture parameters
  fracture:
    aperture: [1.0e-4]
    normal_stiffness: [1.0e+7]
    heat_transfer_factor: [0.634115]

initial_conditions:
  assignment: constant
  T_ini: 300.0
  p_ini: 11.0e+6              # fracture pressure: 1 MPa above the closure stress
  stress:
    values: {Sxx: -10.0e+6, Syy: -10.0e+6, Sxy: 0.0}

boundary_conditions:
  # distant boundaries on rollers
  - faces: [x_min, x_max, y_min, y_max]
    mechanics:
      type: displacement
      components: roller
      values: [0.0]

physics:
  matrix:
    flow: off
    heat: off
    mechanics: quasi_static

simulation:
  # Time
  time_controls:
    t_start: 0.0
    t_end: 1.0
    timestep_initial: 1.0
    timestep_min: 1.0
    timestep_max: 1.0
  solver_type: monolithic

  # Output
  output_frequency: 1
  output_vtk: 1       # turn vtk output on/off

  # Physical controls
  gravity: 0.0    # m/s^2

  # Numerical controls
  iterative_controls:
      NR_tol: 1.0e-6
      iter_max: 100
      NR_step: 1
      aitken_relaxation: 0   # the fracture opens in one step from contact; a secant across that switch reverses the step
